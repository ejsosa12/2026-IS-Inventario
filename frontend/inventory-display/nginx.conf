# One entry point: serves the Angular build and forwards /api/ to Flask,
# so the browser only talks to one origin (no CORS, works with any domain/HTTPS)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Excel uploads (HU-31) are up to 2 MB; nginx's default limit is 1 MB
    client_max_body_size 5m;

    # "backend" is the compose service name, resolved by Docker's internal DNS
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routes (/content/products, ...) do not exist as files:
    # fall back to index.html so a page reload does not give 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS have a hash in their name, so they can be cached for long
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }
}
