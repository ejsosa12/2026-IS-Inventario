@if (isPhone()) {
  <!-- HU-19: phone view. No sidebar, only Existencias, with a small bar on top -->
  <div class="min-h-screen bg-gray-100">
    <header class="sticky top-0 z-40 flex items-center justify-between bg-blue-800 px-4 py-3 text-white shadow">
      <div class="min-w-0">
        <p class="font-bold">Inventario</p>
        <p class="truncate text-xs text-blue-200">
          {{ nombre() }} · {{ isAdmin() ? 'Dueño' : 'Empleado' }}
        </p>
      </div>
      <button type="button" (click)="logout()"
              class="ml-3 whitespace-nowrap rounded-lg border border-blue-300 px-3 py-1.5 text-sm hover:bg-blue-700">
        Cerrar sesión
      </button>
    </header>
    <main>
      <router-outlet />
    </main>
  </div>
} @else {
  <div class="min-h-screen bg-slate-600">

    <!-- Fixed sidebar: stays the same on every page inside /content -->
    <app-side-bar />

    <!-- ml-64 = sidebar width. The current child route (dashboard, usuarios...) is drawn here -->
    <main class="ml-64">
      <router-outlet />
    </main>

  </div>
}
