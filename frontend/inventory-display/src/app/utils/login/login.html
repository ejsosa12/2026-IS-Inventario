<div class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm animate-fade-in">
      <h2 class="text-2xl font-bold text-center mb-1 text-gray-800">Inventario</h2>
      <form (ngSubmit)="login()">
          <div class="mb-4">
              <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
              <input
                  [(ngModel)]="email"
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="email"
                  placeholder="your@example.com"
                  class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500"
                  required
              >
          </div>
          <div class="mb-6">
              <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
              <input
                  [(ngModel)]="password"
                  type="password"
                  id="password"
                  name="password"
                  autocomplete="current-password"
                  placeholder="********"
                  class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500"
                  required
              >
          </div>

          @if (empty_entrie) {
            <div class="mb-4 text-red-500 text-sm font-bold">
              Complete todos los campos requeridos.
            </div>
          }

          @if (error()) {
            <div class="mb-4 text-red-500 text-sm font-bold">
              Usuario o contraseña inválida
            </div>
          }

          <div class="flex items-center justify-between">
              <button
                  type="submit"
                  [disabled]="loading()"
                  class="bg-blue-500 hover:bg-blue-700 disabled:opacity-60 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full"
              >
                  {{ loading() ? 'Conectando...' : 'Iniciar Sesión' }}
              </button>
          </div>
      </form>
  </div>
</div>
