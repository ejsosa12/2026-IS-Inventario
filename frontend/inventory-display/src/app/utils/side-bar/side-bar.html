<div class="fixed inset-y-0 left-0 w-64 bg-cordes-dark shadow-xl z-50">
  <div class="flex items-center justify-center h-16 bg-cordes-blue">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center">
        <i class="fas fa-cube text-cordes-blue text-lg"></i>
      </div>
      <span class="text-white text-xl font-bold">Inventario</span>
    </div>
  </div>

  <nav class="mt-8 px-4">
    <div class="space-y-2">
      <a routerLink="/content/dashboard" class="flex items-center px-4
                         py-3 text-white hover:bg-gray-700 hover:text-white rounded-lg transition-colors group">
        <i class="fas fa-home mr-3 text-cordes-accent group-hover:text-white"></i>
        Dashboard
      </a>
      <!-- HU-29: managing users is only for the owner -->
      @if (isAdmin()) {
        <a routerLink="/content/users" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg
                           transition-colors group">
          <i class="fas fa-users mr-3 text-white group-hover:text-white"></i>
          Usuarios
        </a>
      }
      <a routerLink="/content/products" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg
                         transition-colors group">
        <i class="fas fa-box mr-3 text-white group-hover:text-white"></i>
        Productos
      </a>
      <a routerLink="/content/suppliers" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg
                         transition-colors group">
        <i class="fa fa-industry mr-3 text-white group-hover:text-white"></i>
        Proveedores
      </a>
      <!-- HU-29: money reports are only for the owner -->
      @if (isAdmin()) {
        <a routerLink="/content/reports" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg
          transition-colors group">
          <i class="fas fa-chart-bar mr-3 text-white group-hover:text-white"></i>
          Analísis
        </a>
      }
      <!-- HU-05: only the owner manages categories -->
      @if (isAdmin()) {
        <a routerLink="/content/categories" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg
                           transition-colors group">
          <i class="fa-solid fa-tags mr-3 text-white group-hover:text-white"></i>
          Categorias
        </a>
      }
      <a routerLink="/content/entries" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg
                         transition-colors group">
        <i class="fa-solid fa-plus mr-3 text-white group-hover:text-white"></i>
        Ingresar Mercaderia
      </a>
      <a routerLink="/content/outputs" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg
                         transition-colors group">
        <i class="fa-solid fa-minus mr-3 text-white group-hover:text-white"></i>
        Sacar Mercaderia
      </a>
      <!-- HU-32/33/34: anyone starts a count and prints the sheets -->
      <a routerLink="/content/counts" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg
                         transition-colors group">
        <i class="fas fa-clipboard-list mr-3 text-white group-hover:text-white"></i>
        Conteo Físico
      </a>
      <a routerLink="/content/settings" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700
        hover:text-white rounded-lg transition-colors group">
        <i class="fas fa-cog mr-3 text-white group-hover:text-white"></i>
        Ajustes
      </a>
    </div>
  </nav>

  <div class="absolute bottom-4 left-4 right-4">
    <div class="bg-gray-800 rounded-lg p-4">
      <div class="flex items-center space-x-3">
        <img src="https://cdn-icons-png.flaticon.com/512/17003/17003310.png" alt="Usuario"
        class="w-10 h-10 rounded-full">
        <div>
          <p class="text-white text-sm font-medium">{{ nombre() }}</p>
          <p class="text-gray-400 text-xs">{{ isAdmin() ? 'Dueño' : 'Empleado' }}</p>
          <a href="#" (click)="logout()" class="mt-4 text-white text-sm font-medium hover:bg-blue-500">Cerrar Sesión</a>
        </div>
      </div>
    </div>
  </div>
</div>
