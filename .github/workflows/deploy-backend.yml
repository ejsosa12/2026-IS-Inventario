# On every push to main that touches the backend: build its image, push it to
# GHCR (GitHub's registry) and tell the VPS to pull it and restart.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: # also a "Run workflow" button in the Actions tab

# Two pushes in a row: the older deploy is cancelled, only the latest one runs
concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # lets GITHUB_TOKEN push (and pull) images on ghcr.io

env:
  IMAGE: ghcr.io/ejsosa12/inventario-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # :main is what the VPS pulls; the commit sha allows going back to an older version
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          # Reuse layers from the previous run (pip install only reruns when requirements change)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose and nginx config
        run: scp deploy/docker-compose.yml deploy/nginx.conf "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/inventario/"

      - name: Pull and restart
        run: |
          # The repo is private: the VPS logs in to ghcr.io with this run's temporary
          # token (sent through stdin, never written in the command) and logs out at the end
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/inventario
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T nginx nginx -s reload
            docker logout ghcr.io
            docker image prune -f
          '
