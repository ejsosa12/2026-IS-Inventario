# Public entry point of the VPS: https://api.elbuenclavo.tech/api/... goes to Flask.
# The certificate is from Let's Encrypt (certbot), stored in /opt/inventario/certbot/conf.

# Port 80 (plain HTTP): only the Let's Encrypt challenge, everything else is sent to HTTPS
server {
    listen 80;
    server_name _;

    # certbot renew writes a temporary file here and Let's Encrypt downloads it
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.elbuenclavo.tech$request_uri;
    }
}

# Port 443 (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name api.elbuenclavo.tech;

    ssl_certificate     /etc/letsencrypt/live/api.elbuenclavo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.elbuenclavo.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Excel uploads (HU-31) are up to 2 MB; nginx's default limit is 1 MB
    client_max_body_size 5m;

    # Docker's internal DNS. Resolving "backend" on every request (through the
    # variable) matters: after a deploy the new backend container can get a new
    # IP, and a name resolved only at startup would give 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:5000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The frontend does not live here
    location / {
        return 404;
    }
}
