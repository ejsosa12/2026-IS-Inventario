# Public entry point of the VPS: forwards /api/ to Flask and refuses everything else.
# HTTPS (port 443 + certificate) goes here once there is a domain.
server {
    listen 80;
    server_name _;

    # Excel uploads (HU-31) are up to 2 MB; nginx's default limit is 1 MB
    client_max_body_size 5m;

    # Docker's internal DNS. Resolving "backend" on every request (through the
    # variable) matters: after a deploy the new backend container can get a new
    # IP, and a name resolved only at startup would give 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:5000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The frontend does not live here
    location / {
        return 404;
    }
}
