# Backend stack for the VPS (MariaDB + Flask + nginx). The workflow copies this
# folder to /opt/inventario; the .env with the secrets, db-init/ and certbot/ live only there.
# The backend image is not built here: it is pulled from GHCR (built by GitHub Actions).
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: inventory
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Guatemala time (UTC-6), so NOW()/CURRENT_TIMESTAMP are local, not UTC
      TZ: America/Guatemala
    volumes:
      - db_data:/var/lib/mysql
      # The dump copied by hand with scp; it only runs while db_data is empty
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # No "ports": the database is never reachable from the internet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/ejsosa12/inventario-backend:main
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: inventory
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_KEY: ${FLASK_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8}
      # Same zone as the db, so date.today() ("Ventas de hoy", reports) changes day at local midnight
      TZ: America/Guatemala
    # No "ports" either: only nginx can reach it, through the Docker network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificates and the challenge folder, both written by certbot (below)
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      # The only public ports: 80 redirects to 443 (https://api.elbuenclavo.tech/api/v1/...)
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  # Not started by "up": run by hand or by cron with
  # docker compose run --rm certbot renew --webroot -w /var/www/certbot -q
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  db_data:
