# Backend stack for the VPS (MariaDB + Flask + nginx). The workflow copies this
# folder to /opt/inventario; the .env with the secrets and db-init/ live only there.
# The backend image is not built here: it is pulled from GHCR (built by GitHub Actions).
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: inventory
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # The dump copied by hand with scp; it only runs while db_data is empty
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # No "ports": the database is never reachable from the internet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/ejsosa12/inventario-backend:main
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: inventory
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_KEY: ${FLASK_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8}
    # No "ports" either: only nginx can reach it, through the Docker network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # The only public port: http://<VPS IP>/api/v1/...
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
